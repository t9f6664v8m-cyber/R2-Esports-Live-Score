<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R2 Esports Live Score</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080808;
  color: white;
}

header {
  text-align: center;
  padding: 25px 10px;
  background: linear-gradient(180deg, #171717, #080808);
  border-bottom: 2px solid #c9a227;
}

.logo {
  font-size: 42px;
  font-weight: bold;
  color: #d4af37;
  letter-spacing: 3px;
}

.subtitle {
  color: #aaa;
  margin-top: 5px;
}

.container {
  width: 95%;
  max-width: 1100px;
  margin: 25px auto;
}

.card {
  background: #111;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 20px;
}

h2 {
  color: #d4af37;
  margin-top: 0;
}

table {
  width: 100%;
  border-collapse: collapse;
  overflow: hidden;
}

th {
  background: #d4af37;
  color: #000;
  padding: 12px 6px;
}

td {
  padding: 11px 5px;
  text-align: center;
  border-bottom: 1px solid #292929;
}

tr:nth-child(even) {
  background: #171717;
}

input {
  width: 80px;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #444;
  background: #222;
  color: white;
  text-align: center;
}

.team-input {
  width: 150px;
}

button {
  background: #d4af37;
  color: #000;
  border: none;
  padding: 12px 22px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}

button:hover {
  background: #f0ce55;
}

.note {
  color: #aaa;
  font-size: 14px;
  margin-top: 10px;
}

.footer {
  text-align: center;
  color: #777;
  padding: 25px;
}

@media (max-width: 600px) {
  .logo {
    font-size: 30px;
  }

  table {
    font-size: 12px;
  }

  input {
    width: 55px;
  }

  .team-input {
    width: 100px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">R2 ESPORTS</div>
  <div class="subtitle">LIVE SCORE</div>
</header>

<div class="container">

  <div class="card">
    <h2>🏆 الترتيب العام</h2>

    <table id="rankingTable">
      <thead>
        <tr>
          <th>المركز</th>
          <th>الفريق</th>
          <th>فوز</th>
          <th>ترتيب</th>
          <th>إقصاءات</th>
          <th>الإجمالي</th>
        </tr>
      </thead>

      <tbody id="rankingBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>✏️ إدخال النتائج</h2>

    <table>
      <thead>
        <tr>
          <th>الفريق</th>
          <th>فوز</th>
          <th>نقاط الترتيب</th>
          <th>الإقصاءات</th>
        </tr>
      </thead>

      <tbody id="inputBody"></tbody>
    </table>

    <button onclick="updateScores()">تحديث النتائج</button>

    <div class="note">
      النقاط الإجمالية = نقاط الترتيب + نقاط الإقصاءات + نقاط الفوز
    </div>
  </div>

</div>

<div class="footer">
  R2 Esports © 2026
</div>

<script>

const teams = [];

for (let i = 1; i <= 20; i++) {
  teams.push({
    name: "Team " + i,
    wins: 0,
    placement: 0,
    kills: 0,
    total: 0
  });
}

function createInputs() {

  const body = document.getElementById("inputBody");
  body.innerHTML = "";

  teams.forEach((team, index) => {

    body.innerHTML += `
      <tr>
        <td>
          <input
            class="team-input"
            id="name-${index}"
            value="${team.name}">
        </td>

        <td>
          <input
            type="number"
            min="0"
            id="win-${index}"
            value="${team.wins}">
        </td>

        <td>
          <input
            type="number"
            min="0"
            id="place-${index}"
            value="${team.placement}">
        </td>

        <td>
          <input
            type="number"
            min="0"
            id="kill-${index}"
            value="${team.kills}">
        </td>
      </tr>
    `;
  });
}

function updateScores() {

  teams.forEach((team, index) => {

    team.name =
      document.getElementById(`name-${index}`).value;

    team.wins =
      Number(document.getElementById(`win-${index}`).value);

    team.placement =
      Number(document.getElementById(`place-${index}`).value);

    team.kills =
      Number(document.getElementById(`kill-${index}`).value);

    team.total =
      team.wins * 10 +
      team.placement +
      team.kills;
  });

  teams.sort((a, b) => b.total - a.total);

  renderRanking();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function renderRanking() {

  const body = document.getElementById("rankingBody");

  body.innerHTML = "";

  teams.forEach((team, index) => {

    body.innerHTML += `
      <tr>
        <td>#${index + 1}</td>
        <td>${team.name}</td>
        <td>${team.wins}</td>
        <td>${team.placement}</td>
        <td>${team.kills}</td>
        <td><strong>${team.total}</strong></td>
      </tr>
    `;
  });
}

createInputs();
renderRanking();

</script>

</body>
</html>
