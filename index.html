<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R2 Esports Live Score</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#070707;
color:#fff;
}

header{
padding:28px 15px;
text-align:center;
background:linear-gradient(180deg,#171717,#070707);
border-bottom:2px solid #d4af37;
}

.logo{
font-size:38px;
font-weight:bold;
color:#d4af37;
letter-spacing:3px;
}

.subtitle{
color:#aaa;
margin-top:6px;
}

.container{
width:95%;
max-width:1100px;
margin:25px auto;
}

.card{
background:#111;
border:1px solid #333;
border-radius:14px;
padding:20px;
margin-bottom:22px;
}

h2{
margin-top:0;
color:#d4af37;
}

input{
width:100%;
padding:12px;
margin:7px 0;
background:#1d1d1d;
border:1px solid #444;
border-radius:7px;
color:#fff;
font-size:15px;
}

button{
background:#d4af37;
color:#000;
border:0;
padding:12px 20px;
border-radius:7px;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}

button:hover{
background:#f0ce55;
}

.team-number{
color:#d4af37;
font-weight:bold;
}

.preview-logo{
width:55px;
height:55px;
object-fit:cover;
border-radius:8px;
border:1px solid #d4af37;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#d4af37;
color:#000;
padding:12px 6px;
}

td{
padding:10px 5px;
text-align:center;
border-bottom:1px solid #292929;
}

tr:nth-child(even){
background:#171717;
}

.result-logo{
width:42px;
height:42px;
object-fit:cover;
border-radius:7px;
vertical-align:middle;
}

.team-cell{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.rank{
font-weight:bold;
color:#d4af37;
}

.small{
color:#888;
font-size:12px;
}

.no-teams{
text-align:center;
color:#777;
padding:25px;
}

@media(max-width:600px){
.logo{font-size:28px}
table{font-size:11px}
.result-logo{width:32px;height:32px}
.card{padding:12px}
}
</style>
</head>

<body>

<header>
<div class="logo">R2 ESPORTS</div>
<div class="subtitle">LIVE SCORE</div>
</header>

<div class="container">

<!-- TEAM REGISTRATION -->
<div class="card">

<h2>📝 TEAM REGISTRATION</h2>

<input id="teamName" placeholder="TEAM NAME">

<input id="teamTag" placeholder="TEAM TAG">

<label class="small">TEAM LOGO</label>
<input id="teamLogo" type="file" accept="image/*">

<button onclick="registerTeam()">
REGISTER TEAM
</button>

<div id="registrationMessage"></div>

</div>


<!-- REGISTERED TEAMS -->
<div class="card">

<h2>👥 REGISTERED TEAMS</h2>

<table>

<thead>
<tr>
<th>#</th>
<th>LOGO</th>
<th>TEAM</th>
<th>TAG</th>
</tr>
</thead>

<tbody id="teamsBody"></tbody>

</table>

</div>


<!-- ADMIN RESULTS -->
<div class="card">

<h2>🎮 ENTER GAME RESULT</h2>

<input
id="resultTeamNumber"
type="number"
min="1"
placeholder="TEAM NUMBER">

<input
id="resultKills"
type="number"
min="0"
placeholder="KILLS">

<input
id="resultPlace"
type="number"
min="1"
placeholder="PLACE">

<button onclick="addResult()">
ADD RESULT
</button>

<div id="resultMessage"></div>

</div>


<!-- LIVE SCORE -->
<div class="card">

<h2>🏆 LIVE SCORE</h2>

<table>

<thead>
<tr>
<th>#</th>
<th>TEAM</th>
<th>WINS</th>
<th>PLACE</th>
<th>ELIMS</th>
<th>TOTAL</th>
</tr>
</thead>

<tbody id="rankingBody"></tbody>

</table>

</div>

</div>


<script>

let teams =
JSON.parse(localStorage.getItem("r2Teams")) || [];


/* REGISTER TEAM */

function registerTeam(){

const name =
document.getElementById("teamName").value.trim();

const tag =
document.getElementById("teamTag").value.trim();

const logoInput =
document.getElementById("teamLogo");

if(!name || !tag || !logoInput.files[0]){

document.getElementById("registrationMessage").innerHTML =
"<p style='color:#e6c65c'>Please enter Team Name, Team Tag and Logo.</p>";

return;

}

const reader = new FileReader();

reader.onload = function(e){

const teamNumber = teams.length + 1;

const team = {

number:teamNumber,

name:name,

tag:tag,

logo:e.target.result,

wins:0,

place:0,

kills:0,

total:0

};

teams.push(team);

saveTeams();

renderTeams();

renderRanking();

document.getElementById("teamName").value="";
document.getElementById("teamTag").value="";
document.getElementById("teamLogo").value="";

document.getElementById("registrationMessage").innerHTML =
"<p style='color:#d4af37'>TEAM REGISTERED — TEAM #"+teamNumber+"</p>";

};

reader.readAsDataURL(logoInput.files[0]);

}


/* ADD RESULT */

function addResult(){

const number =
Number(document.getElementById("resultTeamNumber").value);

const kills =
Number(document.getElementById("resultKills").value);

const place =
Number(document.getElementById("resultPlace").value);

const team =
teams.find(t => t.number === number);

if(!team){

document.getElementById("resultMessage").innerHTML =
"<p style='color:red'>TEAM NUMBER NOT FOUND</p>";

return;

}


/*
SCORING
WIN = 10 POINTS
PLACE = PLACEMENT POINTS
KILL = 1 POINT
*/

team.kills = kills;

team.place = place;

team.wins = place === 1 ? 1 : 0;

team.total =
(team.wins * 10) +
place +
kills;

saveTeams();

renderRanking();

document.getElementById("resultMessage").innerHTML =
"<p style='color:#d4af37'>RESULT ADDED TO TEAM #"+number+"</p>";

}


/* SAVE */

function saveTeams(){

localStorage.setItem(
"r2Teams",
JSON.stringify(teams)
);

}


/* REGISTERED TEAMS */

function renderTeams(){

const body =
document.getElementById("teamsBody");

body.innerHTML="";

if(teams.length===0){

body.innerHTML=
"<tr><td colspan='4' class='no-teams'>NO TEAMS REGISTERED</td></tr>";

return;

}

teams.forEach(team=>{

body.innerHTML += `

<tr>

<td class="team-number">
#${String(team.number).padStart(2,"0")}
</td>

<td>
<img
src="${team.logo}"
class="preview-logo">
</td>

<td>
${team.name}
</td>

<td>
${team.tag}
</td>

</tr>

`;

});

}


/* RANKING */

function renderRanking(){

const body =
document.getElementById("rankingBody");

body.innerHTML="";

const sorted =
[...teams].sort((a,b)=>b.total-a.total);

if(sorted.length===0){

body.innerHTML=
"<tr><td colspan='6' class='no-teams'>NO RESULTS YET</td></tr>";

return;

}

sorted.forEach((team,index)=>{

body.innerHTML += `

<tr>

<td class="rank">
#${index+1}
</td>

<td>

<div class="team-cell">

<img
src="${team.logo}"
class="result-logo">

<div>

<strong>${team.name}</strong>

<br>

<span class="small">
#${String(team.number).padStart(2,"0")} • ${team.tag}
</span>

</div>

</div>

</td>

<td>
${team.wins}
</td>

<td>
${team.place}
</td>

<td>
${team.kills}
</td>

<td>
<strong>${team.total}</strong>
</td>

</tr>

`;

});

}


renderTeams();

renderRanking();

</script>

</body>
</html>
